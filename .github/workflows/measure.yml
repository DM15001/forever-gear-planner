name: Measure item effects and set bonuses

# What a proc, an on-use effect or a set bonus is worth cannot be read off an item: it has to be
# simulated, per build. This runs scripts/build-sim-values.mjs for every build and commits
# src/data/simValues/<build>.json. It starts whenever something a measurement depends on changes
# (the simulator, its item database, a build's preset, the script); each build skips itself when
# its own inputs are unchanged. It can also be started by hand, for all builds or some.

on:
  # Started once a night by .github/workflows/engine.yml (after the presets are read), or by hand.
  workflow_dispatch:
    inputs:
      specs:
        description: Build ids, separated by spaces (empty = all)
        required: false
        default: ''
      force:
        description: Measure even if nothing changed
        type: boolean
        default: false

permissions:
  issues: write
  contents: write
  actions: write

concurrency:
  group: measure
  cancel-in-progress: true

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      specs: ${{ steps.specs.outputs.specs }}
    steps:
      - uses: actions/checkout@v4
      - id: specs
        env:
          ONLY: ${{ inputs.specs }}
        run: |
          if [ -n "$ONLY" ]; then
            specs=$(printf '%s\n' $ONLY | jq -R . | jq -sc .)
          else
            specs=$(for f in src/specs/*.json; do jq -r '.id' "$f"; done | jq -R . | jq -sc .)
          fi
          echo "specs=$specs" >> "$GITHUB_OUTPUT"

  measure:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        spec: ${{ fromJson(needs.list.outputs.specs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Measure
        run: node scripts/build-sim-values.mjs --spec "${{ matrix.spec }}" ${{ inputs.force && ' ' || '--if-changed' }}
      - uses: actions/upload-artifact@v4
        with:
          name: values-${{ matrix.spec }}
          path: src/data/simValues/${{ matrix.spec }}.json
          if-no-files-found: ignore

  commit:
    needs: measure
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # The newest main, not the commit that started the run: a measurement takes hours and main moves on.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: values-*
          path: src/data/simValues
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The new numbers are kept as long as the site still builds with them. The tests run afterwards and only
      # report: a failing test must not throw away hours of measuring.
      - run: npm ci
      - run: npm run build
      - name: Commit the new values
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/simValues
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          # The app shows how fresh each build's numbers are.
          node scripts/measurement-status.mjs && git add src/data/measurementStatus.json
          # Low-level items among a slot's best: usually a sign that the simulator values an effect wrongly.
          npx vite-node scripts/check-rankings.ts > /tmp/flags.txt || true
          git add docs/ranking-flags.md || true
          count=$(git diff --cached --name-only | wc -l | tr -d ' ')
          git commit -m "Measured item effects and set bonuses ($count builds updated)" -m "Written by .github/workflows/measure.yml with scripts/build-sim-values.mjs."
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && echo "pushed=true" >> "$GITHUB_OUTPUT" && exit 0
            sleep 10
          done
          exit 1
      - name: Report items that rank suspiciously high
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s /tmp/flags.txt ] || exit 0
          title="Low-level items among a slot's best: check how the simulator values them"
          body="After the last measurement these items below item level 50 are among a slot's three best for a build. Each is either truly special or valued wrongly by WoWSims. Look at the effect, then note the item in src/config/sim-issues.json as fine or wrong.

          $(sed 's/^/- /' /tmp/flags.txt)"
          number=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then gh issue edit "$number" --body "$body"; else gh issue create --title "$title" --label planner-followup --body "$body"; fi
      - name: Tests on the new numbers
        id: tests
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        run: npm test
      - name: Report failing tests
        if: steps.tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Tests fail with the newly measured numbers"
          if [ "$(gh issue list --state open --search "$title in:title" --json number --jq length)" = "0" ]; then
            gh issue create --title "$title" --label planner-followup --body "The measurement was saved, but the planner's tests fail with it. The site keeps working with the new numbers; a test needs a look. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
      # A push made by a workflow does not start other workflows, so the site is deployed by hand here.
      - name: Deploy the site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
