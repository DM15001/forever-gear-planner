name: Read the WoWSims presets

# The builds in scripts/builds are what wowsims.com shows when a preset is loaded. This reads them from WoWSims
# itself: it checks out wowsims/forever at the commit the site's simulator is built from, builds the pieces
# WoWSims' own tests need, and runs scripts/presets/wowsims-dump.ts there, which loads every spec's
# defaults and every preset build the way the page does and writes the page's JSON export of each.
#
# The exports are kept on the branch wowsims-presets (one commit per WoWSims version that changed them), so every
# change WoWSims makes to a preset shows up there as a diff. scripts/apply-presets.mjs then brings scripts/builds
# and the simulator templates in line with them; if the tests pass, that is committed and the site republished.
# .github/workflows/engine.yml starts this after every simulator update.

on:
  workflow_dispatch:
    inputs:
      specs:
        description: Spec folders under ui/specs, separated by spaces (empty = all)
        required: false
        default: ''
      measure:
        description: Start the nightly measurements afterwards (set by engine.yml)
        required: false
        default: 'false'

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: presets
  cancel-in-progress: true

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Which WoWSims is the site on?
        id: version
        run: echo "commit=$(node -e 'console.log(require("./public/sim/setup.json").simVersion.commit)')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: wowsims/forever
          ref: ${{ steps.version.outputs.commit }}
          path: wowsims
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
          cache-dependency-path: wowsims/go.sum
      - uses: ./wowsims/.github/actions/setup-protoc
      - run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: wowsims/package-lock.json
      - name: Build what the WoWSims tests need
        working-directory: wowsims
        run: |
          npm ci
          make ui/generated/proto/api.ts bin/wowsimcli
          make $(sed -n 's/^AUTO_GEN_FILES_TS := //p' makefile)
      - name: Load every preset the way the page does
        working-directory: wowsims
        env:
          DUMP_OUT: ${{ runner.temp }}/presets
        run: |
          mkdir -p ui/_dump && cp ../scripts/presets/wowsims-dump.ts ui/_dump/dump.test.ts
          specs="${{ inputs.specs }}"
          if [ -z "$specs" ]; then specs=$(ls -d ui/specs/*/*/spec.ts | sed 's#ui/specs/##; s#/spec.ts##' | tr '\n' ' '); fi
          echo "Specs: $specs"
          DUMP_SPECS="$specs" npx vitest run ui/_dump
          ls -la "$DUMP_OUT"
      - name: Keep the exports on the branch wowsims-presets
        if: inputs.specs == ''
        run: |
          git fetch -q origin wowsims-presets || true
          git worktree add -q "$RUNNER_TEMP/branch" --detach
          cd "$RUNNER_TEMP/branch"
          if git rev-parse -q --verify origin/wowsims-presets >/dev/null; then git checkout -q -B wowsims-presets origin/wowsims-presets; else git checkout -q --orphan wowsims-presets; fi
          git rm -rqf --cached --ignore-unmatch . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -r {} +
          cp "$RUNNER_TEMP"/presets/*.json .
          echo "${{ steps.version.outputs.commit }}" > WOWSIMS_COMMIT
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then echo "No preset changed."; exit 0; fi
          git commit -q -m "Presets of WoWSims $(echo "${{ steps.version.outputs.commit }}" | cut -c1-10)"
          git push -q origin wowsims-presets
      - name: Bring the builds in line
        id: apply
        if: inputs.specs == ''
        run: |
          # Out of the way: this project's own tests would otherwise pick up the WoWSims test files.
          mv wowsims "$RUNNER_TEMP/wowsims"
          node scripts/apply-presets.mjs "$RUNNER_TEMP/presets" | tee "$RUNNER_TEMP/changed.txt"
          if git diff --quiet; then echo "The builds are what wowsims.com shows."; exit 0; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Rebuild the data, test and build
        id: test
        if: steps.apply.outputs.changed == 'true'
        continue-on-error: true
        run: |
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/wowsims/pages-deploy.git "$RUNNER_TEMP/pages"
          git -C "$RUNNER_TEMP/pages" sparse-checkout set forever
          if [ "$(node -e 'console.log(require(process.argv[1]).commit)' "$RUNNER_TEMP/pages/forever/version.json")" = "${{ steps.version.outputs.commit }}" ]; then
            node scripts/build-data.mjs --pages "$RUNNER_TEMP/pages" --repo "$RUNNER_TEMP/wowsims"
          else
            echo "wowsims.com has moved on; the simulator update will rebuild the data."
          fi
          node scripts/check-builds.mjs
          npm ci
          npm test
          npm run build
      - name: Tests failed on the new builds
        if: steps.apply.outputs.changed == 'true' && steps.test.outcome != 'success'
        run: |
          title="Preset update from WoWSims needs a look"
          if [ "$(gh issue list --state open --search "$title in:title" --json number --jq length)" = "0" ]; then
            gh issue create --title "$title" --label planner-followup --body "WoWSims changed presets, but the planner's tests or build fail with them, so the builds were **not** updated. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          $(cat "$RUNNER_TEMP/changed.txt")"
          fi
          exit 1
      - name: Commit and publish
        id: commit
        if: steps.apply.outputs.changed == 'true' && steps.test.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/measurement-status.mjs || echo "::warning::measurement status not written"
          git add scripts/builds public/sim src/data src/specs
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -q -m "Builds updated to the WoWSims presets of $(echo "${{ steps.version.outputs.commit }}" | cut -c1-10)" -m "$(cat "$RUNNER_TEMP/changed.txt")" -m "Written by .github/workflows/presets.yml with scripts/apply-presets.mjs."
          for attempt in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && echo "pushed=true" >> "$GITHUB_OUTPUT" && break
            sleep 10
          done
      - name: Republish the site
        if: steps.commit.outputs.pushed == 'true'
        run: gh workflow run pages.yml --ref main
      # The measurements start after every simulator update, on the builds as they are after this step: one WoWSims version, one set of presets.
      - name: Start the measurements
        if: inputs.measure == 'true' && inputs.specs == '' && (steps.apply.outputs.changed != 'true' || steps.test.outcome == 'success')
        run: |
          busy=0
          for workflow in measure.yml weights.yml weapons.yml; do
            for status in in_progress queued; do
              count=$(gh api "repos/${{ github.repository }}/actions/workflows/$workflow/runs?status=$status&per_page=1" --jq .total_count)
              busy=$((busy + count))
            done
          done
          if [ "$busy" != "0" ]; then echo "A measurement is still running; the nightly check picks this version up."; exit 0; fi
          for workflow in measure.yml weights.yml weapons.yml; do gh workflow run "$workflow" --ref main; done
      - name: Put the WoWSims checkout back for the clean-up steps
        if: always()
        run: if [ -d "$RUNNER_TEMP/wowsims" ] && [ ! -d wowsims ]; then mv "$RUNNER_TEMP/wowsims" wowsims; fi
