name: Keep the simulator current

# wowsims.com ships a new simulator several times a day. This looks every three hours whether the copy in
# public/sim is still the one wowsims.com runs; if not, it rebuilds the planner's data from WoWSims
# (scripts/build-data.mjs), runs the tests, commits and republishes. So "Simulate" on the site gives the
# same number as wowsims.com for the same character and settings.
#
# Each update also writes what it changed in the item list to docs/item-changes.md and refreshes
# docs/items-to-check.md, the list of items whose source is still a guess.
#
# The long measurements (item effects, stat weights, weapons) are started afterwards only if none of them
# is running, so a measurement in flight can finish; a nightly pass catches up on anything left over.
# If the tests fail on the new data, nothing is committed and an issue says so.

on:
  schedule:
    - cron: '23 */3 * * *'
    - cron: '41 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: engine
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Which simulator does wowsims.com run?
        id: check
        run: |
          theirs=$(curl -fsSL https://raw.githubusercontent.com/wowsims/pages-deploy/main/forever/version.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).commit))')
          ours=$(node -e 'console.log(require("./public/sim/setup.json").simVersion?.commit ?? "")')
          echo "wowsims.com: $theirs"
          echo "this site:   $ours"
          echo "theirs=$theirs" >> "$GITHUB_OUTPUT"
          if [ -n "$theirs" ] && [ "$theirs" != "$ours" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Get WoWSims
        if: steps.check.outputs.changed == 'true'
        run: |
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/wowsims/pages-deploy.git "$RUNNER_TEMP/pages"
          git -C "$RUNNER_TEMP/pages" sparse-checkout set forever
          git clone --quiet --depth 1 https://github.com/wowsims/forever.git "$RUNNER_TEMP/forever"
      - name: Rebuild the data
        if: steps.check.outputs.changed == 'true'
        run: node scripts/build-data.mjs --pages "$RUNNER_TEMP/pages" --repo "$RUNNER_TEMP/forever"
      - name: Test and build
        id: test
        if: steps.check.outputs.changed == 'true'
        continue-on-error: true
        run: |
          npm ci
          npm test
          npm run build
      - name: Tests failed on the new data
        if: steps.check.outputs.changed == 'true' && steps.test.outcome != 'success'
        run: |
          short=$(echo "${{ steps.check.outputs.theirs }}" | cut -c1-10)
          title="Simulator update to WoWSims $short needs a look"
          if [ "$(gh issue list --state open --search "$title in:title" --json number --jq length)" = "0" ]; then
            gh issue create --title "$title" --label planner-followup --body "The simulator on wowsims.com changed (WoWSims commit ${{ steps.check.outputs.theirs }}), but the planner's tests or build fail on the new data, so the copy on this site was **not** updated. Until this is fixed, \"Simulate\" here can differ from wowsims.com. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          exit 1
      - name: Commit and publish
        id: commit
        if: steps.check.outputs.changed == 'true' && steps.test.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          short=$(echo "${{ steps.check.outputs.theirs }}" | cut -c1-10)
          # What the update changed in the items (docs/item-changes.md) and which sources are still guessed (docs/items-to-check.md).
          items=$(node scripts/item-report.mjs --log "WoWSims $short" | head -1) || items="item report failed"
          npx vite-node scripts/items-to-check.ts || echo "::warning::items-to-check failed"
          git add public/sim src/data docs
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -q -m "Simulator updated to WoWSims $short" -m "Items: $items" -m "Written by .github/workflows/engine.yml with scripts/build-data.mjs."
          for attempt in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && echo "pushed=true" >> "$GITHUB_OUTPUT" && break
            sleep 10
          done
      - name: Do the builds still fit the new data?
        if: steps.check.outputs.changed == 'true' && steps.test.outcome == 'success'
        run: |
          found=$(node scripts/check-builds.mjs)
          if [ -z "$found" ]; then exit 0; fi
          echo "$found"
          title="Build presets no longer fit the WoWSims data"
          if [ "$(gh issue list --state open --search "$title in:title" --json number --jq length)" = "0" ]; then
            gh issue create --title "$title" --label planner-followup --body "After the update to WoWSims ${{ steps.check.outputs.theirs }}, some builds carry settings the data no longer allows. wowsims.com drops these on import, so \"Simulate\" here can differ by a few DPS until the builds in scripts/builds are brought in line with the WoWSims presets.

          $found"
          fi
      - name: Republish the site
        if: steps.commit.outputs.pushed == 'true'
        run: gh workflow run pages.yml --ref main
      - name: Start the measurements, unless one is running
        if: steps.commit.outputs.pushed == 'true' || github.event.schedule == '41 1 * * *'
        run: |
          busy=0
          for workflow in measure.yml weights.yml weapons.yml; do
            for status in in_progress queued; do
              count=$(gh api "repos/${{ github.repository }}/actions/workflows/$workflow/runs?status=$status&per_page=1" --jq .total_count)
              busy=$((busy + count))
            done
          done
          if [ "$busy" != "0" ]; then echo "A measurement is running; the nightly pass picks this update up."; exit 0; fi
          for workflow in measure.yml weights.yml weapons.yml; do gh workflow run "$workflow" --ref main; done
