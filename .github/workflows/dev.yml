name: Publish dev branch

# A push to dev republishes the site. The deploy itself runs from main, because only main may deploy to GitHub Pages.
# The dev branch is built here first, so a broken one shows up as a failed run instead of a silent "did not build" page.
on:
  push:
    branches: [dev]

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_CHANNEL: dev
      - run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
