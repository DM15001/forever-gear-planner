name: Measure weapons as a whole

# For melee and Hunters a weapon is more than its DPS number: speed, damage range, weapon talents and
# the hand it is held in all count. This measures every weapon as a whole, per hand, for the builds
# that hit with their weapons (scripts/build-weapon-values.mjs) and commits
# src/data/weaponValues/<build>.json. It starts when the simulator, its item database, a preset or
# the item list changes; each build skips itself when its own inputs are unchanged.

on:
  # Started once a night by .github/workflows/engine.yml (after the presets are read), or by hand.
  workflow_dispatch:
    inputs:
      specs:
        description: Build ids, separated by spaces (empty = all)
        required: false
        default: ''
      force:
        description: Measure even if nothing changed
        type: boolean
        default: false
      collect_from:
        description: Do not measure; commit the results of this earlier run (its run id) instead
        required: false
        default: ''

permissions:
  issues: write
  contents: write
  actions: write

concurrency:
  group: weapons
  cancel-in-progress: true

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      specs: ${{ steps.specs.outputs.specs }}
    steps:
      - uses: actions/checkout@v4
      - id: specs
        env:
          ONLY: ${{ inputs.specs }}
        run: |
          if [ -n "$ONLY" ]; then
            specs=$(printf '%s\n' $ONLY | jq -R . | jq -sc .)
          else
            specs=$(for f in src/specs/*.json; do jq -r 'select(.role != "healer" and ((.weights.mainHandDps // 0) > 0 or (.weights.rangedDps // 0) > 0)) | .id' "$f"; done | jq -R . | jq -sc .)
          fi
          echo "specs=$specs" >> "$GITHUB_OUTPUT"

  measure:
    needs: list
    if: ${{ !inputs.collect_from }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        spec: ${{ fromJson(needs.list.outputs.specs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Measure
        run: node scripts/build-weapon-values.mjs --spec "${{ matrix.spec }}" ${{ inputs.force && ' ' || '--if-changed' }}
      - uses: actions/upload-artifact@v4
        with:
          name: weapons-${{ matrix.spec }}
          path: src/data/weaponValues/${{ matrix.spec }}.json
          if-no-files-found: ignore

  commit:
    needs: measure
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # The newest main, not the commit that started the run: a measurement takes hours and main moves on.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: weapons-*
          path: src/data/weaponValues
          merge-multiple: true
          # The results of an earlier run can be committed without measuring again (input collect_from).
          run-id: ${{ inputs.collect_from || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The new numbers are kept as long as the site still builds with them. The tests run afterwards and only
      # report: a failing test must not throw away hours of measuring.
      - run: npm ci
      - run: npm run build
      - name: Commit the new values
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/weaponValues
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          # The app shows how fresh each build's numbers are.
          node scripts/measurement-status.mjs && git add src/data/measurementStatus.json
          git diff --cached --name-only > /tmp/changed.txt
          count=$(wc -l < /tmp/changed.txt | tr -d ' ')
          git commit -m "Measured weapons as a whole ($count builds updated)" -m "Written by .github/workflows/weapons.yml with scripts/build-weapon-values.mjs."
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && echo "pushed=true" >> "$GITHUB_OUTPUT" && exit 0
            sleep 10
          done
          exit 1
      - name: Tests on the new numbers
        id: tests
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        run: npm test
      - name: Report failing tests
        if: steps.tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Tests fail with the newly measured numbers"
          if [ "$(gh issue list --state open --search "$title in:title" --json number --jq length)" = "0" ]; then
            gh issue create --title "$title" --label planner-followup --body "The measurement was saved, but the planner's tests fail with it. The site keeps working with the new numbers; a test needs a look. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
      # A push made by a workflow does not start other workflows, so the site is deployed by hand here.
      - name: Deploy the site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
